<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳驰 VSCMG | 工业级数字孪生控制台 V6.2 峰值保持版</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #010409; --panel: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); --accent: #3b82f6; --orange: #f59e0b; --green: #10b981; --text-main: #f8fafc; --text-dim: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 65px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(1, 4, 9, 0.95); backdrop-filter: blur(20px); z-index: 100; }
        .main-container { flex: 1; display: grid; grid-template-columns: 320px 1fr 360px; overflow: hidden; }
        .sidebar { background: var(--panel); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .sidebar-left { border-right: 1px solid var(--border); }
        .sidebar-right { border-left: 1px solid var(--border); }
        h3 { font-size: 12px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-weight: 800; }

        .viewport { position: relative; background: radial-gradient(circle at 50% 50%, #111827 0%, #000 100%); overflow: hidden; }
        model-viewer { width: 100%; height: 100%; outline: none; filter: brightness(1.15) contrast(1.2) saturate(1.1); }
        .action-bar { position: absolute; top: 25px; left: 25px; display: flex; gap: 12px; z-index: 10; }
        .btn { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        .input-group { background: rgba(0,0,0,0.3); padding: 18px; border-radius: 12px; border: 1px solid var(--border); }
        .field-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 10px; font-weight: 600; }
        input[type="number"], input[type="range"] { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; border-radius: 8px; outline: none; }
        input[type="range"] { accent-color: var(--accent); cursor: pointer;}
        .btn-run { background: linear-gradient(135deg, var(--orange), #d97706); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.3s; margin-top: auto;}

        .data-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 18px; border-radius: 14px; position: relative;}
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .data-row:last-child { border-bottom: none; }
        .val-hero { font-size: 28px; font-weight: 900; color: var(--orange); display: block; margin-top: 5px; font-family: monospace; }
        .chart-box { height: 130px; background: #000; border-radius: 10px; border: 1px solid var(--border); padding: 10px; }
        
        .hold-badge { font-size: 9px; background: rgba(16, 185, 129, 0.2); color: var(--green); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--green); margin-left: 8px; vertical-align: middle;}
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 900; font-size: 22px;">WENCHI <span style="color:var(--accent)">VSCMG</span></div>
        <div style="font-size: 12px; color: var(--green); font-weight: 600;"><i class="fa-solid fa-check-circle"></i> 动态峰值保持引擎 V6.2</div>
    </header>

    <div class="main-container">
        <aside class="sidebar sidebar-left">
            <h3><i class="fa-solid fa-weight-hanging"></i> 负载与瞬态边界条件</h3>
            
            <div class="input-group">
                <span class="field-label">车体等效负载 LOAD (KG)</span>
                <input type="number" id="massInput" value="75">
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <span class="field-label">预设瞬态冲击力矩 (SHOCK MAGNITUDE)</span>
                <input type="range" id="distRange" min="10" max="200" value="150" step="1" oninput="updateUIOnly()">
                <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--accent); font-weight:bold;">
                    <span>10</span><span id="distVal">150 N·m</span><span>200</span>
                </div>
            </div>

            <button class="btn-run" onclick="injectShock()">
                <i class="fa-solid fa-bolt"></i> 注入预设冲击 (执行抗扰)
            </button>
        </aside>

        <main class="viewport">
            <div class="action-bar">
                <button id="btnModel" class="btn active" onclick="switchView('model')"><i class="fa-solid fa-cube"></i> 模型装配</button>
                <button id="btnExplode" class="btn" onclick="switchView('explode')"><i class="fa-solid fa-layer-group"></i> 结构分解</button>
            </div>
            <model-viewer id="viewer" src="model.glb" camera-controls auto-rotate shadow-intensity="1.5" environment-image="neutral" exposure="1.3"></model-viewer>
        </main>

        <aside class="sidebar sidebar-right">
            <h3><i class="fa-solid fa-compass"></i> 姿态实时感知 (MEMS Data)</h3>
            <div class="data-card">
                <div class="data-row"><span style="font-size:11px;color:var(--text-dim)">X轴 倾斜角 (ROLL)</span><span id="gyroX" style="color:var(--accent);font-family:monospace;font-weight:bold;">0.00°</span></div>
                <div class="data-row"><span style="font-size:11px;color:var(--text-dim)">车体角速度 (BODY RATE)</span><span id="gyroRate" style="color:var(--accent);font-family:monospace;font-weight:bold;">0.000 rad/s</span></div>
            </div>

            <h3><i class="fa-solid fa-microchip"></i> VSCMG 瞬态峰值输出</h3>
            <div class="data-card" style="border-color: rgba(16, 185, 129, 0.3);">
                <span class="field-label">峰值补偿力矩 (PEAK TORQUE) <span class="hold-badge">HOLD</span></span>
                <span class="val-hero" id="torqueOut" style="color:var(--accent);">0.00 <span style="font-size:14px;color:var(--text-dim);">N·m</span></span>
                
                <span class="field-label" style="margin-top:15px;">峰值框架角速度 (PEAK GIMBAL RATE) <span class="hold-badge">HOLD</span></span>
                <span class="val-hero" id="gimbalOut" style="color:var(--green);">0.00 <span style="font-size:14px;color:var(--text-dim);">rad/s</span></span>
            </div>

            <h3><i class="fa-solid fa-chart-line"></i> 姿态相轨迹收敛 (实时)</h3>
            <div class="chart-box">
                <svg viewBox="0 0 200 80" width="100%" height="100%">
                    <path id="stableLine" d="" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
                    <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(255,255,255,0.2)" stroke-dasharray="4" />
                </svg>
            </div>
        </aside>
    </div>

    <script>
        // VSCMG 核心物理仿真引擎
        const Physics = {
            dt: 0.02,        
            phi: 0,          
            omega: 0,        
            integral_e: 0,   
            
            g: 9.81, h: 0.35, I_sys: 8.5, 
            H_wheel: 35,     
            
            Kp: 2500, Kd: 400, Ki: 800, max_torque: 300,

            step: function(mass, shock_dist) {
                let noise = (Math.random() - 0.5) * 1.5; 
                let total_ext_torque = shock_dist + noise;

                let T_g = mass * this.g * this.h * Math.sin(this.phi);
                
                let error = 0 - this.phi;
                this.integral_e += error * this.dt;
                this.integral_e = Math.max(-0.5, Math.min(0.5, this.integral_e));
                
                let T_cmd = this.Kp * error - this.Kd * this.omega + this.Ki * this.integral_e;
                T_cmd = Math.max(-this.max_torque, Math.min(this.max_torque, T_cmd));
                
                let net_torque = T_g + total_ext_torque + T_cmd; 
                let alpha = net_torque / this.I_sys; 
                this.omega += alpha * this.dt;       
                this.phi += this.omega * this.dt;    
                
                let gimbal_rate = -T_cmd / this.H_wheel;

                return { 
                    roll: this.phi, 
                    roll_rate: this.omega, 
                    torque_out: -T_cmd, 
                    gimbal_rate: gimbal_rate
                };
            }
        };

        // UI 状态变量
        let currentShock = 0; 
        let peakTorque = 0;   // 用于保存峰值力矩
        let peakGimbal = 0;   // 用于保存峰值框架角速度
        const historyData = new Array(60).fill(0);

        function switchView(mode) {
            const isEx = mode === 'explode';
            document.getElementById('viewer').src = isEx ? "model_exploded.glb" : "model.glb";
            document.getElementById('btnExplode').classList.toggle('active', isEx);
            document.getElementById('btnModel').classList.toggle('active', !isEx);
        }

        // 仅更新滑动条显示的预设数值
        function updateUIOnly() {
            document.getElementById('distVal').innerText = `${document.getElementById('distRange').value} N·m`;
        }

        // 注入瞬态冲击，并清空上一次的峰值记录
        function injectShock() {
            currentShock = parseFloat(document.getElementById('distRange').value) || 150; 
            peakTorque = 0; // 重置峰值
            peakGimbal = 0; // 重置峰值
            
            document.getElementById('stableLine').style.stroke = "#f59e0b";
            setTimeout(() => { document.getElementById('stableLine').style.stroke = "#3b82f6"; }, 600);
        }

        // 50Hz 实时物理循环
        setInterval(() => {
            const mass = parseFloat(document.getElementById('massInput').value) || 75;
            
            let state = Physics.step(mass, currentShock);
            
            // 峰值捕捉逻辑：只有新计算出的绝对值更大时，才更新并保留
            if (Math.abs(state.torque_out) > peakTorque) {
                peakTorque = Math.abs(state.torque_out);
            }
            if (Math.abs(state.gimbal_rate) > peakGimbal) {
                peakGimbal = Math.abs(state.gimbal_rate);
            }

            // 右侧面板：显示被冻结的峰值 (Peak Hold)
            document.getElementById('torqueOut').innerHTML = `${peakTorque.toFixed(1)} <span style="font-size:14px;color:var(--text-dim)">N·m</span>`;
            document.getElementById('gimbalOut').innerHTML = `${peakGimbal.toFixed(2)} <span style="font-size:14px;color:var(--text-dim)">rad/s</span>`;
            
            // 姿态面板：显示真实的、正在衰减归零的实时姿态数据
            document.getElementById('gyroX').innerText = `${(state.roll * 180 / Math.PI).toFixed(2)}°`;
            document.getElementById('gyroRate').innerText = `${state.roll_rate.toFixed(3)} rad/s`;

            // 更新实时收敛曲线
            historyData.push(state.roll);
            historyData.shift();
            
            let d = "M0 40 ";
            for(let i = 0; i < historyData.length; i++) {
                let x = i * (200 / 59);
                let y = 40 - (historyData[i] * 500); 
                y = Math.max(5, Math.min(75, y));
                d += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
            }
            document.getElementById('stableLine').setAttribute('d', d);
            
            // 冲击力自然指数衰减
            currentShock *= 0.85; 
        }, 20); 
    </script>
</body>
</html>
