<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳驰 VSCMG | 工业级数字孪生控制台 V6.0 终极版</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #010409;
            --panel: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --orange: #f59e0b;
            --green: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部导航栏 */
        header {
            height: 65px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: rgba(1, 4, 9, 0.95); backdrop-filter: blur(20px); z-index: 100;
        }

        .nav-links { display: flex; gap: 30px; }
        .nav-item { color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.3s; cursor: pointer; }
        .nav-item.active, .nav-item:hover { color: var(--accent); }

        /* 三栏布局 - 左右固定宽度，防挤压 */
        .main-container { flex: 1; display: grid; grid-template-columns: 320px 1fr 360px; overflow: hidden; }

        /* 侧边栏通用样式 */
        .sidebar { background: var(--panel); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .sidebar-left { border-right: 1px solid var(--border); }
        .sidebar-right { border-left: 1px solid var(--border); }

        h3 { font-size: 12px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-weight: 800; }

        /* 3D 视窗区域 */
        .viewport { position: relative; background: radial-gradient(circle at 50% 50%, #111827 0%, #000 100%); overflow: hidden; }
        model-viewer { 
            width: 100%; height: 100%; outline: none; 
            filter: brightness(1.15) contrast(1.2) saturate(1.1); 
        }

        /* 视图切换按钮 */
        .action-bar { position: absolute; top: 25px; left: 25px; display: flex; gap: 12px; z-index: 10; }
        .btn { 
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); color: #fff; padding: 10px 18px; 
            border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.2); }
        .btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* 零件信息弹窗 */
        #infoCard { 
            position: absolute; top: 85px; left: 25px; width: 280px; background: rgba(1, 4, 9, 0.9); 
            border: 1px solid var(--orange); border-radius: 12px; padding: 20px; backdrop-filter: blur(10px); 
            display: none; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* 输入组件 */
        .input-group { background: rgba(0,0,0,0.3); padding: 18px; border-radius: 12px; border: 1px solid var(--border); }
        .field-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 10px; font-weight: 600; }
        input[type="number"] { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; border-radius: 8px; outline: none; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }

        .btn-run { 
            background: linear-gradient(135deg, var(--accent), #1e40af); color: white; border: none; 
            padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; margin-top: auto; transition: 0.3s;
        }

        /* 遥测数据卡片 */
        .data-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 20px; border-radius: 14px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .data-row:last-child { border-bottom: none; }
        .data-label { font-size: 11px; color: var(--text-dim); }
        .data-value { font-family: monospace; font-size: 15px; color: var(--accent); font-weight: bold; }
        .val-hero { font-size: 32px; font-weight: 900; color: var(--orange); display: block; margin-top: 5px; font-family: monospace; }

        /* 姿态曲线图容器 */
        .chart-box { height: 140px; background: #000; border-radius: 10px; border: 1px solid var(--border); margin-top: 10px; padding: 10px; }
        
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 900; font-size: 22px; letter-spacing: -1px;">WENCHI <span style="color:var(--accent)">VSCMG</span></div>
        <nav class="nav-links">
            <a class="nav-item active"><i class="fa-solid fa-desktop"></i> 模型控制台</a>
            <a class="nav-item"><i class="fa-solid fa-circle-info"></i> 详细信息</a>
            <a class="nav-item"><i class="fa-solid fa-flask"></i> 仿真模拟阶段 II</a>
        </nav>
        <div style="font-size: 12px; color: var(--green); font-weight: 600;"><i class="fa-solid fa-circle-dot"></i> PID解算内核已连接</div>
    </header>

    <div class="main-container">
        <aside class="sidebar sidebar-left">
            <h3><i class="fa-solid fa-weight-hanging"></i> 负载与干扰设定</h3>
            
            <div class="input-group">
                <span class="field-label">输入负载载荷 LOAD (KG)</span>
                <input type="number" id="massInput" value="75">
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <span class="field-label">外部干扰力矩 DISTURBANCE (N·M)</span>
                <input type="range" id="distRange" min="0" max="150" value="45" oninput="updateUIOnly()">
                <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--accent); font-weight:bold;">
                    <span>0</span>
                    <span id="distVal">45 N·m</span>
                    <span>150</span>
                </div>
            </div>

            <button class="btn-run" onclick="triggerPulse()">
                <i class="fa-solid fa-bolt"></i> 注入瞬态干扰 (抗扰仿真)
            </button>
        </aside>

        <main class="viewport">
            <div class="action-bar">
                <button id="btnModel" class="btn active" onclick="switchView('model')"><i class="fa-solid fa-cube"></i> 模型装配</button>
                <button id="btnExplode" class="btn" onclick="switchView('explode')"><i class="fa-solid fa-layer-group"></i> 结构分解</button>
            </div>

            <div id="infoCard">
                <h4 id="partTitle" style="color:var(--orange); font-size:16px; margin-bottom:10px;">核心组件</h4>
                <p id="partDesc" style="font-size:13px; color:var(--text-dim); line-height:1.6;"></p>
                <div style="margin-top:15px; font-size:11px; color:var(--accent);">点击背景空白处返回</div>
            </div>

            <model-viewer 
                id="viewer" 
                src="model.glb" 
                camera-controls 
                auto-rotate 
                shadow-intensity="1.5" 
                shadow-softness="0.8"
                environment-image="neutral"
                exposure="1.3"
                interaction-prompt="none">
            </model-viewer>
        </main>

        <aside class="sidebar sidebar-right">
            <h3><i class="fa-solid fa-compass"></i> 三轴陀螺仪数据</h3>
            <div class="data-card">
                <div class="data-row"><span class="data-label">X轴 倾斜角 (ROLL)</span><span class="data-value" id="gyroX">0.00°</span></div>
                <div class="data-row"><span class="data-label">Y轴 俯仰角 (PITCH)</span><span class="data-value" id="gyroY">0.00°</span></div>
                <div class="data-row"><span class="data-label">Z轴 偏航角 (YAW)</span><span class="data-value" id="gyroZ">0.00°</span></div>
            </div>

            <h3><i class="fa-solid fa-microchip"></i> 控制器补偿输出</h3>
            <div class="data-card">
                <span class="field-label">输出补偿力矩 (TORQUE)</span>
                <span class="val-hero" id="torqueOut">0.00 <span style="font-size:14px; color:var(--text-dim);">N·m</span></span>
                
                <span class="field-label" style="margin-top:20px;">实时角速度响应 (VELOCITY)</span>
                <span class="val-hero" id="velOut" style="color:var(--green);">0.000 <span style="font-size:14px; color:var(--text-dim);">rad/s</span></span>
            </div>

            <h3><i class="fa-solid fa-wave-square"></i> 动态收敛曲线 (实时演算)</h3>
            <div class="chart-box">
                <svg viewBox="0 0 200 80" width="100%" height="100%">
                    <path id="stableLine" d="M0 40 L 200 40" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
                    <line x1="0" y1="40" x2="200" y2="40" stroke="rgba(255,255,255,0.2)" stroke-dasharray="4" />
                </svg>
            </div>
        </aside>
    </div>

    <script>
        // ==========================================
        // VSCMG 核心动力学仿真引擎 (欧拉法数值积分)
        // ==========================================
        const DynamicsEngine = {
            dt: 0.02,        // 仿真步长 50Hz
            phi: 0,          // 当前倾角
            omega: 0,        // 当前角速度
            integral_e: 0,   // PID积分
            
            g: 9.81,
            h: 0.35,         // 重心高度
            I_sys: 8.5,      // 转动惯量
            
            Kp: 1800,        // PID 比例
            Kd: 250,         // PID 微分
            Ki: 50,          // PID 积分
            max_torque: 250, // 最大力矩限制

            step: function(mass, external_shock) {
                // 重力失稳力矩
                let T_g = mass * this.g * this.h * Math.sin(this.phi);
                
                // PID 闭环控制解算
                let error = 0 - this.phi;
                this.integral_e += error * this.dt;
                this.integral_e = Math.max(-0.5, Math.min(0.5, this.integral_e));
                let T_cmd = this.Kp * error - this.Kd * this.omega + this.Ki * this.integral_e;
                T_cmd = Math.max(-this.max_torque, Math.min(this.max_torque, T_cmd));
                
                // 系统总力矩演算
                let net_torque = T_g + external_shock + T_cmd;
                let alpha = net_torque / this.I_sys; 
                this.omega += alpha * this.dt;       
                this.phi += this.omega * this.dt;    
                
                // 引入传感器自然白噪声
                let noise = (Math.random() - 0.5) * 0.001;
                return { roll: this.phi + noise, roll_rate: this.omega + noise, torque_out: -T_cmd };
            }
        };

        // ==========================================
        // 前端 UI 交互逻辑
        // ==========================================
        const viewer = document.getElementById('viewer');
        const infoCard = document.getElementById('infoCard');
        let currentShock = 0; 
        const historyData = new Array(50).fill(0);

        // 模拟零件数据
        const partsData = [
            { name: "高精动量飞轮", desc: "采用航空级铝合金加工，最高转速 8000rpm，为系统提供核心抗扰动能。" },
            { name: "两轴万向节", desc: "高刚性承载结构，配合编码器实现空间矢量力矩的精准传递。" }
        ];

        // 视图切换
        function switchView(mode) {
            const isExplode = mode === 'explode';
            viewer.src = isExplode ? "model_exploded.glb" : "model.glb";
            if(isExplode) {
                viewer.removeAttribute('auto-rotate');
                document.getElementById('btnExplode').classList.add('active');
                document.getElementById('btnModel').classList.remove('active');
            } else {
                viewer.setAttribute('auto-rotate', '');
                document.getElementById('btnModel').classList.add('active');
                document.getElementById('btnExplode').classList.remove('active');
                infoCard.style.display = 'none';
            }
        }

        viewer.addEventListener('click', (ev) => {
            if (!document.getElementById('btnExplode').classList.contains('active')) return;
            if (ev.clientX % 2 === 0) { 
                const part = partsData[Math.floor(Math.random() * partsData.length)];
                document.getElementById('partTitle').innerText = part.name;
                document.getElementById('partDesc').innerText = part.desc;
                infoCard.style.display = 'block';
            } else {
                infoCard.style.display = 'none'; 
            }
        });

        // 仅更新滑动条显示的数值
        function updateUIOnly() {
            const dist = document.getElementById('distRange').value;
            document.getElementById('distVal').innerText = `${dist} N·m`;
        }

        // 注入物理脉冲冲击
        function triggerPulse() {
            const dist = parseInt(document.getElementById('distRange').value);
            currentShock = dist; // 将滑块上的力矩瞬间施加到物理引擎上
            
            const path = document.getElementById('stableLine');
            path.style.stroke = "#f59e0b"; // 曲线变色警示
            setTimeout(() => { path.style.stroke = "#3b82f6"; }, 600);
        }

        // 高频物理引擎循环 (50Hz)
        setInterval(() => {
            const mass = parseFloat(document.getElementById('massInput').value) || 0;
            
            // 步进动力学解算
            let state = DynamicsEngine.step(mass, currentShock);
            
            let rollDeg = state.roll * 180 / Math.PI;
            let rateDeg = state.roll_rate * 180 / Math.PI;

            // 更新仪表盘数值
            document.getElementById('torqueOut').innerHTML = `${Math.abs(state.torque_out).toFixed(2)} <span style="font-size:14px; color:var(--text-dim);">N·m</span>`;
            document.getElementById('velOut').innerHTML = `${Math.abs(state.roll_rate).toFixed(3)} <span style="font-size:14px; color:var(--text-dim);">rad/s</span>`;
            document.getElementById('gyroX').innerText = `${rollDeg.toFixed(2)}°`;
            document.getElementById('gyroY').innerText = `${(rateDeg * 0.05).toFixed(2)}°`; 
            document.getElementById('gyroZ').innerText = `0.00°`;

            // 更新曲线数据队列
            historyData.push(state.roll);
            historyData.shift();
            
            // 绘制真实物理曲线
            let d = "M0 40 ";
            for(let i = 0; i < historyData.length; i++) {
                let x = i * (200 / 49);
                let y = 40 - (historyData[i] * 400); // 放大偏转幅度便于观察
                y = Math.max(5, Math.min(75, y));    // 限幅
                d += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
            }
            document.getElementById('stableLine').setAttribute('d', d);
            
            // 冲击力自然衰减
            currentShock *= 0.85; 

        }, 20); 

    </script>
</body>
</html>
